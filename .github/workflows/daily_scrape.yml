name: Daily Job Digest

on:
  schedule:
    # Runs every day at 8:00 AM Eastern Time (12:00 UTC)
    - cron: "0 12 * * *"

  # Lets you trigger it manually from GitHub's website with one click
  workflow_dispatch:

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the job scraper
        env:
          EMAIL_SENDER:      ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:   ${{ secrets.EMAIL_RECIPIENT }}
          USAJOBS_API_KEY:   ${{ secrets.USAJOBS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      # This saves the seen_jobs.json file back to your repo so it
      # persists across runs and jobs don't repeat in future emails
      - name: Save seen jobs list
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json || true
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git push || true

