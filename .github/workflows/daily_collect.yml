name: Daily Job Collection

on:
  schedule:
    # 06:07 UTC is 2:07 AM Eastern.
    #
    # Two deliberate choices here. GitHub's scheduled runs are best effort and
    # get delayed under load, sometimes by hours. Minute :07 avoids the :00 and
    # :30 spikes when everyone else's jobs fire. Running at 2 AM instead of
    # 6:30 AM leaves roughly five hours of slack before the Cowork task reads
    # the file at 7:30 AM Eastern, so even a badly delayed run still lands
    # in time.
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Collect jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python job_scraper.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job_results.json seen_jobs.json
          git diff --staged --quiet || git commit -m "Job results $(date -u +%Y-%m-%d)"
          git push
